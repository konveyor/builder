version: 2
updates:
  # Keep the pinned GitHub Actions current (checkout, docker/*, attest,
  # sbom-action, upload/download-artifact). All version and security
  # updates are grouped into a single PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: all
        patterns:
          - "*"
