name: 'Detect and add new UBI variants'

# Weekly check for new UBI major versions (e.g. ubi11) on
# registry.access.redhat.com. When a major is served that this repo has no
# variant for, register it in variants.txt (both flavors) and add the
# README table rows, then open a PR for review. Detection only probes the
# registry; generation is mechanical templating — the Dockerfiles are
# shared and parametrized by UBI_MAJOR, so no Dockerfile changes. Note the opened PR gets no workflow runs of its
# own: it is created with the builtin GITHUB_TOKEN, whose events never
# trigger workflows — CI builds the variant once the branch lands (or a
# maintainer pushes to it, e.g. an empty commit).
#
# Uses only the builtin GITHUB_TOKEN (contents: write for the branch push,
# pull-requests: write for the PR).

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be generated without committing or opening a PR'
        required: false
        type: boolean
        default: false
      force_major:
        description: 'Generate for this major regardless of registry detection (testing)'
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/add-ubi-variant.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: add-ubi-variant
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      FORCE_MAJOR: ${{ github.event_name == 'workflow_dispatch' && inputs.force_major || '' }}
    steps:
      - name: add checkout action...
        uses: actions/checkout@v6

      - name: Detect new UBI major and generate variant
        run: |
          set -euo pipefail
          shopt -s inherit_errexit

          # registry probe: 0 = available, 1 = confirmed missing, 2 = inconclusive
          registry_has() {
            local err
            if err=$(docker manifest inspect "registry.access.redhat.com/ubi$1:latest" 2>&1); then
              return 0
            fi
            case "$err" in
              *"name unknown"*|*"not found"*|*"manifest unknown"*|*"no such manifest"*) return 1 ;;
              *) echo "WARNING: registry check for ubi$1 inconclusive: $err" >&2; return 2 ;;
            esac
          }

          known=$(grep -vE '^[[:space:]]*(#|$)' variants.txt | awk '{print $1}' | sort -n -u)
          max_known=$(echo "$known" | tail -1)
          min_known=$(echo "$known" | head -1)
          echo "Existing UBI majors: $(echo "$known" | tr '\n' ' ')(min=$min_known max=$max_known)"

          # Control: the registry must confirm a known major, else detection is
          # unreliable (network/auth issue) and no conclusion can be drawn.
          if ! registry_has "$max_known"; then
            echo "ERROR: control probe for ubi$max_known failed; aborting without conclusions"
            exit 1
          fi

          if [ -n "$FORCE_MAJOR" ]; then
            if ! [[ "$FORCE_MAJOR" =~ ^[1-9][0-9]*$ ]]; then
              echo "ERROR: force_major must be a positive integer (got '${FORCE_MAJOR}')"
              exit 1
            fi
            target="$FORCE_MAJOR"
            echo "FORCE_MAJOR set: generating for ubi${target} regardless of detection"
          else
            m=$((max_known + 1))
            registry_has "$m" || probe_rc=$?
            case "${probe_rc:-0}" in
              0)
                echo "ubi${m} is available on registry.access.redhat.com"
                target="$m"
                # a second consecutive new major is picked up by a later run
                if registry_has "$((m + 1))"; then
                  echo "NOTE: ubi$((m + 1)) is also available; a later run will propose it"
                fi
                ;;
              1)
                echo "No new UBI major available; nothing to do."
                exit 0
                ;;
              *)
                # Do not report "nothing to do" off an inconclusive probe —
                # fail visibly so the miss is seen and retried next run.
                echo "ERROR: probe for ubi${m} was inconclusive; aborting without conclusions"
                exit 1
                ;;
            esac
          fi

          if grep -qE "^${target} (standard|fips)$" variants.txt; then
            echo "ubi${target} variant already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/pr-body.md <<BODYEOF
          Auto-generated by the add-ubi-variant workflow: \`registry.access.redhat.com\` now serves \`ubi${target}\`, and this repo had no variant for it.

          Changes:
          - \`variants.txt\` registers \`ubi${target}\` standard + FIPS
          - \`README.md\` table rows

          Everything else derives the variant automatically: the dispatcher,
          build.yml, the drift check, and badge generation enumerate variants
          from \`variants.txt\`, and submit-sboms.yml from the published Quay
          tags. The Dockerfiles are shared and parametrized by \`UBI_MAJOR\`,
          so no Dockerfile change is needed.

          Review notes:
          - Check for UBI ${target} base-image changes (package set, dnf behavior) that may need adjusting in the shared Dockerfiles.
          - This PR is opened with the builtin GITHUB_TOKEN, so GitHub triggers no workflow runs on it (recursion guard). To see CI build the new variant, push any commit to the \`add-ubi${target}\` branch (e.g. an empty one) or re-run the checks manually after merging.
          BODYEOF

          branch="add-ubi${target}"
          if git ls-remote --exit-code --heads "origin" "$branch" >/dev/null 2>&1; then
            open_prs=$(gh pr list --head "$branch" --state open --json number --jq 'length')
            closed_prs=$(gh pr list --head "$branch" --state closed --json number --jq 'length')
            if [ "${open_prs}" -gt 0 ]; then
              echo "A proposal PR for ${branch} is already open; nothing to do."
              exit 0
            fi
            if [ "${closed_prs}" -gt 0 ]; then
              echo "A PR for ${branch} was closed without deleting the branch; not re-proposing (delete ${branch} to allow a new proposal)."
              exit 0
            fi
            # Branch without any PR: a previous run pushed it but PR creation
            # failed. Recover by creating the PR from the existing branch.
            if [ "${DRY_RUN}" != "true" ] && [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
              echo "Branch ${branch} exists without a PR; retrying PR creation"
              gh pr create --head "$branch" \
                --title "Add UBI ${target} variant (auto-generated from UBI ${max_known})" \
                --body-file /tmp/pr-body.md
            else
              echo "[skip: dry-run or not on ${DEFAULT_BRANCH}] would retry PR creation for ${branch}"
            fi
            exit 0
          fi

          echo "Generating UBI ${target} variant from UBI ${max_known} ..."
          python3 - "$target" "$max_known" <<'PYEOF'
          import pathlib
          import sys

          n, src = sys.argv[1], sys.argv[2]

          def read(p):
              return pathlib.Path(p).read_text()

          def write(p, t):
              pathlib.Path(p).write_text(t)

          # 1. Register both flavors of the new major in variants.txt,
          # keeping the registry sorted. Everything else in the repo
          # (dispatcher, build.yml, drift check, badges) enumerates
          # variants from this file.
          raw = read("variants.txt")
          header = [l for l in raw.splitlines(keepends=True)
                    if not l.strip() or l.lstrip().startswith("#")]
          entries = {tuple(l.split()) for l in raw.splitlines()
                     if l.strip() and not l.lstrip().startswith("#")}
          entries |= {(n, "standard"), (n, "fips")}
          ordered = sorted(entries, key=lambda e: (int(e[0]), e[1] != "standard"))
          write("variants.txt", "".join(header) + "".join("%s %s\n" % e for e in ordered))

          # 2. README table rows.
          for needle in [f"| `ubi{src}` |", f"| `ubi{src}` FIPS |"]:
              lines = read("README.md").splitlines(keepends=True)
              out, hit = [], 0
              for l in lines:
                  out.append(l)
                  if needle in l:
                      out.append(l.replace(f"ubi{src}", f"ubi{n}"))
                      hit += 1
              if hit != 1:
                  sys.exit(f"ERROR: expected exactly one '{needle}' line in README.md, found {hit}")
              write("README.md", "".join(out))

          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short

          if [ "${DRY_RUN}" = "true" ]; then
            echo "[dry-run] would commit to ${branch} and open a PR"
            exit 0
          fi

          # PRs are only proposed from default-branch runs; other refs (self-test
          # pushes to feature branches) stop after validating the generation.
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "[skip: not on ${DEFAULT_BRANCH}] generation validated, not proposing a PR from this ref"
            exit 0
          fi

          git checkout -b "$branch"
          git commit -s -m "Add UBI ${target} variant

          Generated by the add-ubi-variant workflow: registry.access.redhat.com
          now serves ubi${target}. Registered in variants.txt (standard +
          FIPS); README rows derived from UBI ${max_known}."

          git push -u origin "$branch"
          gh pr create --title "Add UBI ${target} variant (auto-generated from UBI ${max_known})" \
            --body-file /tmp/pr-body.md
