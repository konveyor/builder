name: 'Scheduled version check and dispatch'

# Single scheduled entry point for all image builds.
#
# Instead of every build workflow running on its own weekly `schedule`, this
# workflow runs once on a schedule, determines the Go versions that upstream
# currently supports (go.dev for the standard images, golang-fips/go for the
# OpenSSL FIPS images) and compares them against the versions already published
# to quay.io/konveyor/builder. It only dispatches a build workflow when a newer
# (differing) version is available than the one currently published.
#
# workflow_dispatch events are an explicit exception to the rule that
# GITHUB_TOKEN cannot trigger new workflow runs, so no additional token is
# required (see https://docs.github.com/en/actions/concepts/security/github_token).
#
# The dispatch job sets GH_REPO because it never checks out the repository:
# without it, `gh workflow run` cannot resolve the repository and fails with
# "failed to run git: fatal: not a git repository". Only runs on the default
# branch dispatch builds; pushes to other branches (and manual dispatches from
# other refs) validate the version check without dispatching.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log the workflows that would be dispatched without dispatching them'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/scheduled_dispatch.yml'
  schedule:
    - cron: '0 0 * * 6'

concurrency:
  group: scheduled-dispatch
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: add checkout action...
        uses: actions/checkout@v7

      - name: Check version availability and dispatch builds
        run: |
          set -euo pipefail
          # Bash clears errexit inside command substitutions unless this is set;
          # without it a failed curl/jq in published_tags would yield a partial
          # tag list and the dispatcher would act on incomplete data.
          shopt -s inherit_errexit

          # --- Image variants ------------------------------------------------------
          # Variants are derived from the Dockerfiles present in the repo, so a
          # new variant needs no dispatcher registration. Each dispatches the
          # shared build.yml workflow with its ubi/flavor; expected tag prefixes
          # follow the published scheme (ubi8 unprefixed, ubi9/ubi10 prefixed).
          variants=$(grep -vE '^[[:space:]]*(#|$)' variants.txt | sort -n)

          variant_prefix() {
            # $1 = ubi major, $2 = flavor; patterns are flavor:major
            case "$2:$1" in
              standard:8) echo "" ;;
              standard:*) echo "ubi$1-" ;;
              fips:8)     echo "openssl-fips-" ;;
              fips:*)     echo "ubi$1-openssl-fips-" ;;
            esac
          }

          # Collect all active tags published to quay.io/konveyor/builder.
          published_tags() {
            local page=1 resp
            while :; do
              resp=$(curl -sfS --retry 3 --retry-delay 5 --max-time 30 \
                "https://quay.io/api/v1/repository/konveyor/builder/tag/?limit=100&page=${page}&onlyActiveTags=true")
              echo "$resp" | jq -r '.tags[].name'
              [ "$(echo "$resp" | jq -r '.has_additional')" = "true" ] || break
              page=$((page + 1))
            done
          }

          echo "Fetching published tags from quay.io/konveyor/builder ..."
          PUBLISHED_TAGS="$(published_tags)"

          tag_published() { grep -qxF "$1" <<< "$PUBLISHED_TAGS"; }

          dispatch() {
            # $1 = ubi major, $2 = flavor, $3 = go_version input
            local ubi="$1" flavor="$2" input="$3"
            if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
              echo "  [skip: not on ${DEFAULT_BRANCH}] would dispatch build.yml (ubi=${ubi} flavor=${flavor} go_version='${input}')"
            elif [ "${DRY_RUN}" = "true" ]; then
              echo "  [dry-run] would dispatch build.yml (ubi=${ubi} flavor=${flavor} go_version='${input}')"
            else
              echo "  dispatching build.yml (ubi=${ubi} flavor=${flavor} go_version='${input}')"
              gh workflow run build.yml -f ubi="${ubi}" -f flavor="${flavor}" -f go_version="${input}"
            fi
          }

          # ------------------------------------------------------------------------
          # Standard images: supported Go versions come from go.dev (newest first,
          # one entry per supported minor release). Index 0 is the latest release;
          # the build workflow treats an empty go_version as "build latest".
          # ------------------------------------------------------------------------
          echo "Checking standard (non-FIPS) image versions ..."
          go_json=$(curl -sfS --retry 3 --retry-delay 5 --max-time 30 'https://go.dev/dl/?mode=json')
          mapfile -t GO_VERSIONS < <(echo "$go_json" | jq -r '[.[] | select(.stable == true) | .version | ltrimstr("go")] | .[0:2] | .[]')

          for idx in "${!GO_VERSIONS[@]}"; do
            ver="${GO_VERSIONS[$idx]}"
            if [ "$idx" -eq 0 ]; then input=""; else input="$ver"; fi
            while read -r ubi flavor; do
              [ "$flavor" = "standard" ] || continue
              expected="$(variant_prefix "$ubi" "$flavor")v${ver}"
              if tag_published "$expected"; then
                echo "[ubi${ubi}] $expected already published, skipping"
              else
                echo "[ubi${ubi}] $expected not published, newer version available"
                dispatch "$ubi" "$flavor" "$input"
              fi
            done <<< "$variants"
          done

          # ------------------------------------------------------------------------
          # FIPS images: supported versions come from golang-fips/go releases.
          # Candidates are non-draft releases tagged go<version>-<build>-(openssl-fips|hostfips-release)
          # (the pure-digit build segment excludes rc tags); golang-fips ships Go 1.27+
          # FIPS via the native crypto/fips140 module ("hostfips-release" tags) while
          # older minors keep "openssl-fips" tags. Per minor, prefer the newest stable
          # release, falling back to the newest prerelease when that minor has no
          # stable release yet. Top 2 minors, matching Go's two-release support policy.
          # Index 0 is the latest; the build workflow treats an empty go_version as
          # "build latest".
          # ------------------------------------------------------------------------
          echo "Checking OpenSSL FIPS image versions ..."
          # jq -s 'add' flattens the paginated response into one array regardless
          # of how gh emits pages, so the selection below always sees all releases.
          fips_releases=$(gh api repos/golang-fips/go/releases --paginate | jq -s 'add')
          mapfile -t FIPS_ENTRIES < <(echo "$fips_releases" | jq -r '
            def cands: [ .[] | select(.draft == false)
              | select(.tag_name | test("^go[0-9]+\\.[0-9]+(\\.[0-9]+)?-[0-9]+-(openssl-fips|hostfips-release)$"))
              | {tag: .tag_name, pre: .prerelease} ];
            def vkey: (.tag | split("-")[0] | ltrimstr("go") | split(".") | map(tonumber));
            def bkey: (.tag | split("-")[1] | tonumber);
            def ossl: (if .tag | endswith("openssl-fips") then 1 else 0 end);
            def best: max_by([ (if .pre then 0 else 1 end), vkey, bkey, ossl ]);
            cands | group_by(vkey | .[0:2]) | sort_by(.[0] | vkey | .[0:2]) | reverse
            | .[0:2] | map(best)
            | to_entries[] | "\(.key) \(.value.tag | split("-")[0] | ltrimstr("go"))"
          ')

          for entry in "${FIPS_ENTRIES[@]}"; do
            idx="${entry%% *}"
            ver="${entry#* }"
            if [ "$idx" -eq 0 ]; then input=""; else input="$ver"; fi
            while read -r ubi flavor; do
              [ "$flavor" = "fips" ] || continue
              expected="$(variant_prefix "$ubi" "$flavor")v${ver}"
              if tag_published "$expected"; then
                echo "[ubi${ubi}-fips] $expected already published, skipping"
              else
                echo "[ubi${ubi}-fips] $expected not published, newer version available"
                dispatch "$ubi" "$flavor" "$input"
              fi
            done <<< "$variants"
          done

      - name: Refresh README version badges
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The badge refresh does not depend on the version check above, so run
          # it even when that step failed — badges still converge weekly.
          # readme-badges.yml only makes sense from default-branch runs, so gate
          # it the same way as dispatching.
          if [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ] && [ "${DRY_RUN}" != "true" ]; then
            echo "Refreshing README version badges ..."
            gh workflow run readme-badges.yml
          else
            echo "[skip: not on ${DEFAULT_BRANCH} or dry-run] would refresh README version badges"
          fi

      - name: Submit image SBOMs to the dependency graph
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # SBOM submission keeps GitHub's dependency graph in sync with the
          # published images; weekly convergence on top of the post-publish
          # triggers in the build workflows.
          if [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ] && [ "${DRY_RUN}" != "true" ]; then
            echo "Submitting image SBOMs ..."
            gh workflow run submit-sboms.yml
          else
            echo "[skip: not on ${DEFAULT_BRANCH} or dry-run] would submit image SBOMs"
          fi
